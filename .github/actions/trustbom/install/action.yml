          exit 1
        fi
        prefix="$RUNNER_TEMP/trustbom-$version"
        mkdir -p "$prefix"
        npm install --prefix "$prefix" --ignore-scripts --offline --no-audit --no-fund --loglevel error "$GITHUB_WORKSPACE/.trustbom-test/packages/resolveinterim-trustbom-linux-x64-$version.tgz" "$GITHUB_WORKSPACE/.trustbom-test/packages/trustbom-$version.tgz"
        launcher="$prefix/node_modules/trustbom/bin/trustbom.js"
        echo "Installed trustbom $(node "$launcher" --version)"
