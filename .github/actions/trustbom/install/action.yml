name: Install AI TrustBOM
description: Install the pinned trustbom npm package without install scripts and expose its launcher.
author: Spaverlock

outputs:
  launcher:
    description: Path to the installed trustbom launcher script; run it with node.
    value: ${{ steps.install.outputs.launcher }}

runs:
  using: composite
  steps:
    - name: Install AI TrustBOM
      id: install
      shell: bash
      env:
        TRUSTBOM_PINNED_VERSION: "1.0.0-dev.244"
      run: |
        set -euo pipefail
        version="${TRUSTBOM_ACTION_VERSION:-$TRUSTBOM_PINNED_VERSION}"
        pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        if ! [[ "$version" =~ $pattern ]]; then
